<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Librería externa para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ESTILOS VISUALES */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', serif;
            background-color: #fdf8f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        header {
            margin-top: 50px;
            padding: 20px;
        }

        .flower-text {
            font-family: 'Lato', sans-serif;
            color: #c85a5a;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            color: #2c3e50;
            margin: 0;
            font-weight: 700;
        }

        h1 em {
            color: #c85a5a;
            font-style: italic;
        }

        .date-text {
            font-family: 'Lato', sans-serif;
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        figure {
            margin: 30px 0;
            padding: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        figure:hover {
            transform: rotate(0deg);
        }

        figure img {
            max-width: 85vw;
            width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        /* Efecto de transición suave para las imágenes y textos */
        #main-image, #special-message {
            transition: opacity 0.5s ease-in-out;
        }

        .special-message {
            font-size: 1.6rem;
            color: #8e44ad;
            margin: 10px 20px 30px 20px;
            font-style: italic;
            max-width: 600px;
            line-height: 1.4;
        }

        /* SECCIÓN DEL REGALO MODIFICADA */
        .gift-section {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            padding: 40px 30px;
            border-radius: 20px;
            margin: 0px 20px 60px 20px;
            box-shadow: 0 8px 20px rgba(200, 90, 90, 0.15);
            max-width: 500px;
            border: 2px dashed #f5b7b1;
            display: none; /* Oculto al principio */
            flex-direction: column;
            align-items: center;
        }

        .gift-title {
            font-size: 1.8rem;
            color: #a93226;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Estilos generales para botones */
        .btn {
            background-color: #c85a5a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            box-shadow: 0 4px 10px rgba(200, 90, 90, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .btn:hover {
            background-color: #a93226;
            transform: scale(1.05);
        }

        /* El texto del regalo está oculto al principio */
        .gift-content {
            display: none; 
            font-family: 'Lato', sans-serif;
            font-size: 1.3rem;
            color: #4a2311;
            line-height: 1.6;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Animación para cuando aparece el regalo */
        .fade-in {
            display: block;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main>
        <header>
            <p class="flower-text" id="header-name">✿ de [De] para [Para] ✿</p>
            <h1 id="main-title">Feliz<br>aniversario,<br><em id="pet-name">mi amor</em></h1>
            <p class="date-text" id="anniversary-date">[Fecha]</p>
        </header>

        <figure>
            <img id="main-image" src="" alt="Nuestra foto">
        </figure>

        <div class="special-message" id="special-message">
            <!-- El mensaje se carga por código -->
        </div>

        <!-- Botón para pasar a la siguiente etapa -->
        <button id="next-btn" class="btn">Siguiente 🤍</button>

        <section class="gift-section" id="gift-section">
            <div class="gift-title">💌 Tu Regalo 💌</div>
            
            <!-- Botón nuevo para revelar -->
            <button id="reveal-btn" class="btn">🎁 Toca para abrir tu regalo</button>
            
            <!-- Contenedor del texto (oculto inicialmente) -->
            <div class="gift-content" id="gift-text">
                <!-- El regalo se carga por código -->
            </div>
        </section>
    </main>

    <script>
        // =====================================================================
        // 🛠️ ZONA DE PERSONALIZACIÓN
        // =====================================================================
        
        const config = {
            de: "Blanca",
            para: "Pablo",
            apodo: "mi amor",
            fecha: "12 de septiembre",
            
            // --- ETAPA 1 ---
            foto1: "FB_IMG_1789186189575.jpg",   
            mensaje1: "Hoy se cumple una nueva etapa para nuestra relación, nuestro tiempo juntos ha sido hermoso.",
            
            // --- ETAPA 2 ---
            // 👇 REEMPLAZA ESTO por el nombre exacto de tu segunda imagen 👇
            foto2: "NOMBRE_DE_TU_SEGUNDA_FOTO.jpg", 
            mensaje2: "Para que creemos más recuerdos juntos te quiero dar algo...",
            
            // --- EL REGALO ---
            regalo: "¡2 pases diarios al Parque Tricao para el día que quieras! 🌿🦜"
        };

        // =====================================================================
        // Lógica de carga interactiva
        // =====================================================================
        
        // Cargar textos fijos del encabezado
        document.getElementById('header-name').innerText = `✿ de ${config.de} para ${config.para} ✿`;
        document.getElementById('main-title').innerHTML = `Feliz<br>aniversario,<br><em>${config.apodo}</em>`;
        document.getElementById('anniversary-date').innerText = config.fecha;
        
        // Elementos dinámicos
        const imgElement = document.getElementById('main-image');
        const msgElement = document.getElementById('special-message');
        const nextBtn = document.getElementById('next-btn');
        
        const giftSection = document.getElementById('gift-section');
        const btnRevelar = document.getElementById('reveal-btn');
        const textoRegalo = document.getElementById('gift-text');

        // 1. Mostrar la Etapa 1 al cargar la página
        imgElement.src = config.foto1;
        msgElement.innerText = `"${config.mensaje1}"`;

        // 2. Transición a la Etapa 2 cuando se presiona "Siguiente"
        nextBtn.addEventListener('click', () => {
            // Desvanecer contenido actual
            imgElement.style.opacity = 0;
            msgElement.style.opacity = 0;
            
            setTimeout(() => {
                // Cambiar imagen y texto mientras están invisibles
                imgElement.src = config.foto2;
                msgElement.innerText = `"${config.mensaje2}"`;
                
                // Volver a hacerlos visibles
                imgElement.style.opacity = 1;
                msgElement.style.opacity = 1;
                
                // Ocultar el botón "Siguiente" y mostrar la caja del regalo
                nextBtn.style.display = 'none';
                giftSection.style.display = 'flex';
            }, 500); // Espera medio segundo para hacer el cambio
        });

        // 3. Lógica del botón sorpresa y confeti
        btnRevelar.addEventListener('click', () => {
            btnRevelar.style.display = 'none';
            
            textoRegalo.innerText = config.regalo;
            textoRegalo.classList.add('fade-in');
            
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#c85a5a', '#a93226', '#ffb6b9', '#fdf8f5'] 
            });
        });
    </script>
</body>
</html>
