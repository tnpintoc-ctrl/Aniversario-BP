<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILOS VISUALES */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', serif;
            background-color: #fdf8f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        header {
            margin-top: 50px;
            padding: 20px;
        }

        .flower-text {
            font-family: 'Lato', sans-serif;
            color: #c85a5a;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            color: #2c3e50;
            margin: 0;
            font-weight: 700;
        }

        h1 em {
            color: #c85a5a;
            font-style: italic;
        }

        .date-text {
            font-family: 'Lato', sans-serif;
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        figure {
            margin: 30px 0;
            padding: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        figure:hover {
            transform: rotate(0deg);
        }

        figure img {
            max-width: 85vw;
            width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        /* SECCIÓN DEL MENSAJE Y REGALO */
        .special-message {
            font-size: 1.6rem;
            color: #8e44ad;
            margin: 10px 20px 30px 20px;
            font-style: italic;
            max-width: 600px;
            line-height: 1.4;
        }

        .gift-section {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            padding: 40px 30px;
            border-radius: 20px;
            margin: 0px 20px 60px 20px;
            box-shadow: 0 8px 20px rgba(200, 90, 90, 0.15);
            max-width: 500px;
            border: 2px dashed #f5b7b1;
        }

        .gift-title {
            font-size: 1.8rem;
            color: #a93226;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .gift-content {
            font-family: 'Lato', sans-serif;
            font-size: 1.2rem;
            color: #4a2311;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <main>
        <header>
            <p class="flower-text" id="header-name">✿ de [De] para [Para] ✿</p>
            <h1 id="main-title">Feliz<br>aniversario,<br><em id="pet-name">mi amor</em></h1>
            <p class="date-text" id="anniversary-date">[Fecha]</p>
        </header>

        <figure>
            <!-- La imagen se reemplazará automáticamente por la configuración de abajo -->
            <img id="main-image" src="https://via.placeholder.com/350x450/f9e7e7/c85a5a?text=Pon+tu+foto+aqui" alt="Nuestra foto">
        </figure>

        <div class="special-message" id="special-message">
            "[Mensaje]"
        </div>

        <section class="gift-section">
            <div class="gift-title">💌 Tu Regalo 💌</div>
            <div class="gift-content" id="gift-text">
                [Aquí va el regalo]
            </div>
        </section>
    </main>

    <script>
        // =====================================================================
        // 🛠️ ZONA DE PERSONALIZACIÓN SÚPER FÁCIL
        // =====================================================================
        
        const config = {
            de: "Blanca",
            para: "Pablo",
            apodo: "mi amor",
            fecha: "12 de septiembre",
            
            // Tu mensaje romántico:
            mensaje: "Gracias por siempre ser mi lugar seguro. ❤️",
            
            // La foto (asegúrate de que esté subida a GitHub):
            fotoUrl: "IMG-20260912-WAO000.jpg",   
            
            // 🎁 Tu regalo:
            regalo: "¡2 pases diarios al Parque Tricao para el día que quieras! 🌿🦜"
        };

        // =====================================================================
        // Lógica para actualizar la página (No necesitas tocar esto)
        // =====================================================================
        
        document.getElementById('header-name').innerText = `✿ de ${config.de} para ${config.para} ✿`;
        document.getElementById('main-title').innerHTML = `Feliz<br>aniversario,<br><em>${config.apodo}</em>`;
        document.getElementById('anniversary-date').innerText = config.fecha;
        document.getElementById('special-message').innerText = `"${config.mensaje}"`;
        document.getElementById('gift-text').innerText = config.regalo;
        
        if (config.fotoUrl !== "") {
            document.getElementById('main-image').src = config.fotoUrl;
        }
    </script>
</body>
</html>
