<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', serif;
            background-color: #fdf8f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        header { margin-top: 50px; padding: 20px; }

        .flower-text {
            font-family: 'Lato', sans-serif;
            color: #c85a5a;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 { font-size: 3.5rem; line-height: 1.2; color: #2c3e50; margin: 0; font-weight: 700; }
        h1 em { color: #c85a5a; font-style: italic; }

        .date-text {
            font-family: 'Lato', sans-serif;
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* Contenedor interactivo */
        .story-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        figure {
            margin: 20px 0;
            padding: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        figure:hover { transform: rotate(0deg); }

        figure img {
            max-width: 85vw;
            width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
            object-fit: cover;
        }

        .special-message {
            font-size: 1.6rem;
            color: #8e44ad;
            margin: 10px 20px 30px 20px;
            font-style: italic;
            line-height: 1.4;
            min-height: 80px; 
        }

        .action-btn {
            background-color: #c85a5a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            box-shadow: 0 4px 10px rgba(200, 90, 90, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .action-btn:hover { background-color: #a93226; transform: scale(1.05); }

        .gift-section {
            display: none; 
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            padding: 40px 30px;
            border-radius: 20px;
            margin: 0px 20px 60px 20px;
            box-shadow: 0 8px 20px rgba(200, 90, 90, 0.15);
            border: 2px dashed #f5b7b1;
            flex-direction: column;
            align-items: center;
        }

        .gift-title {
            font-size: 1.8rem;
            color: #a93226;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .gift-content {
            font-family: 'Lato', sans-serif;
            font-size: 1.3rem;
            color: #4a2311;
            line-height: 1.6;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .fade-anim {
            animation: fadeInOut 0.6s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <main>
        <header>
            <p class="flower-text" id="header-name"></p>
            <h1 id="main-title">Feliz<br>aniversario,<br><em id="pet-name"></em></h1>
            <p class="date-text" id="anniversary-date"></p>
        </header>

        <div class="story-container">
            <figure id="photo-container">
                <img id="main-image" src="" alt="Nuestra foto">
            </figure>

            <div class="special-message" id="special-message"></div>

            <button id="action-btn" class="action-btn">Siguiente ✨</button>
        </div>

        <section class="gift-section" id="gift-section">
            <div class="gift-title">💌 Tu Regalo 💌</div>
            <div class="gift-content" id="gift-text"></div>
        </section>
    </main>

    <script>
        // =====================================================================
        // 🛠️ ZONA DE PERSONALIZACIÓN
        // =====================================================================
        
        const config = {
            de: "Blanca",
            para: "Pablo",
            apodo: "mi amor",
            fecha: "12 de septiembre",
            
            // PRIMERA ETAPA
            foto1: "FB_IMG_1789186189575.jpg", 
            mensaje1: "Hoy se cumple una nueva etapa para nuestra relación, nuestro tiempo juntos ha sido hermoso.",
            
            // SEGUNDA ETAPA 
            foto2: "IMG-20260912-WA0000.jpg", 
            mensaje2: "Para que creemos más recuerdos juntos te quiero dar algo...",
            
            // EL REGALO FINAL
            regalo: "¡2 pases diarios al Parque Tricao para el día que quieras! 🌿🦜"
        };

        // =====================================================================
        // Lógica de la historia interactiva
        // =====================================================================
        
        document.getElementById('header-name').innerText = `✿ de ${config.de} para ${config.para} ✿`;
        document.getElementById('main-title').innerHTML = `Feliz<br>aniversario,<br><em>${config.apodo}</em>`;
        document.getElementById('anniversary-date').innerText = config.fecha;
        document.getElementById('gift-text').innerText = config.regalo;

        let pasoActual = 1;
        const imgElement = document.getElementById('main-image');
        const msgElement = document.getElementById('special-message');
        const btnAccion = document.getElementById('action-btn');
        const seccionRegalo = document.getElementById('gift-section');
        const photoContainer = document.getElementById('photo-container');

        imgElement.src = config.foto1;
        msgElement.innerText = `"${config.mensaje1}"`;

        function triggerAnimation() {
            photoContainer.classList.remove('fade-anim');
            msgElement.classList.remove('fade-anim');
            void photoContainer.offsetWidth; 
            photoContainer.classList.add('fade-anim');
            msgElement.classList.add('fade-anim');
        }

        btnAccion.addEventListener('click', () => {
            if (pasoActual === 1) {
                triggerAnimation();
                imgElement.src = config.foto2;
                msgElement.innerText = `"${config.mensaje2}"`;
                btnAccion.innerText = "🎁 Toca para abrir tu regalo";
                pasoActual = 2;
                
            } else if (pasoActual === 2) {
                btnAccion.style.display = 'none'; 
                seccionRegalo.style.display = 'flex'; 
                seccionRegalo.classList.add('fade-anim');
                
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#c85a5a', '#a93226', '#ffb6b9', '#fdf8f5'] 
                });
            }
        });
    </script>
</body>
</html>
